<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Echo Workstation M0</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; margin: 0; background: #f6f7f9; }
    header { padding: 10px 16px; background: #fff; border-bottom: 1px solid #e2e5ea; display: flex; gap: 12px; align-items: center; }
    header h1 { font-size: 16px; margin: 0; }
    header .meta { color: #666; font-size: 12px; }
    main { padding: 16px; max-width: 900px; margin: 0 auto; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 14px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
    button.primary { background: #1a66ff; border-color: #1a66ff; color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    #log { background: #111820; color: #d6e2f0; border-radius: 6px; padding: 12px; font: 13px/1.6 Consolas, monospace; white-space: pre-wrap; min-height: 320px; max-height: 70vh; overflow: auto; }
    #log .cot { color: #8ab4f8; }
    #log .tool { color: #fdd663; }
    #log .system { color: #9aa5b1; }
    #sessions { font-size: 12px; color: #333; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <h1>Echo Workstation M0</h1>
    <span class="meta" id="meta"></span>
  </header>
  <main>
    <div class="row">
      <input type="text" id="prompt" placeholder="输入提示词，回车发送（默认：请用一句话介绍你自己…）" />
      <button class="primary" id="run">试跑</button>
      <button id="stop" disabled>停止</button>
      <button id="list">列出会话</button>
    </div>
    <div id="sessions"></div>
    <div id="log"><span class="system">就绪。本页由 harness 的 web 服务器 serve，/api 为同源调用。</span></div>
  </main>
  <script>
    // 同源 API：页面由 harness serve，location.origin 即 API 基址
    const BASE = location.origin + '/api'
    const logEl = document.getElementById('log')
    const metaEl = document.getElementById('meta')
    metaEl.textContent = window.echo
      ? `electron ${window.echo.versions.electron} / node ${window.echo.versions.node} / ${location.origin}`
      : location.origin

    let rpcId = 0
    async function rpc(method, payload) {
      const res = await fetch(`${BASE}/${method}`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ type: 'client-request', rpcId: `m0-${++rpcId}`, method, payload }),
      })
      const msg = await res.json()
      if (!res.ok) throw new Error(`HTTP ${res.status}`)
      if (!msg.result?.ok) throw new Error(`${method}: ${msg.result?.error?.message}`)
      return msg.result.value
    }

    function line(cls, text) {
      const div = document.createElement('div')
      if (cls) div.className = cls
      div.textContent = text
      logEl.appendChild(div)
      logEl.scrollTop = logEl.scrollHeight
      return div
    }

    let currentSession = null
    let currentWs = null
    const blockKind = new Map()

    function renderEvent(ev) {
      const d = ev.data ?? {}
      switch (ev.type) {
        case 'turn/start': line('system', `── 回合 ${d.turn} 开始 ──`); break
        case 'user/message': line('', `👤 ${textOf(d)}`); break
        case 'assistant/chunk': {
          const c = d.chunk ?? {}
          if (c.type === 'block-start') {
            blockKind.set(c.index, c.blockType)
            if (c.blockType === 'reasoning') line('cot', '💭 CoT:')
          } else if (c.type === 'block-end') {
            const kind = blockKind.get(c.index)
            if (kind === 'reasoning') line('', '')
          } else if (c.type === 'text-delta' || c.type === 'reasoning-delta') {
            const last = logEl.lastElementChild
            last.textContent += (c.text ?? '')
          }
          break
        }
        case 'tool/call': line('tool', `🔧 工具调用: ${d.name} ${d.arguments ?? ''}`); break
        case 'tool/result': line('tool', '📦 工具结果已返回'); break
        case 'assistant/message': line('', '✅ 助手消息已提交'); break
        case 'turn/end':
          line('system', `── 回合 ${d.turn} 结束（${d.reason?.kind}）──`)
          stopStreaming()
          break
      }
    }

    function textOf(data) {
      const msg = data?.message ?? data
      if (typeof msg?.text === 'string') return msg.text
      if (Array.isArray(msg?.content)) {
        return msg.content.filter(b => b.type === 'text').map(b => b.text).join('\n')
      }
      return '(无文本)'
    }

    function openMux(sessionId) {
      const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/events.mux')
      currentWs = ws
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data)
          if (msg?.type !== 'server-request') return
          const p = msg.payload ?? {}
          if (p.sessionId !== sessionId) return
          if (p.type === 'session/event') renderEvent(p.event)
        } catch { /* 忽略坏帧 */ }
      }
    }

    function stopStreaming() {
      document.getElementById('run').disabled = false
      document.getElementById('stop').disabled = true
      if (currentWs) { currentWs.close(); currentWs = null }
      currentSession = null
    }

    document.getElementById('run').onclick = async () => {
      const text = document.getElementById('prompt').value.trim()
        || '请用一句话介绍你自己，并说明你能做什么。不要调用任何工具。'
      document.getElementById('run').disabled = true
      document.getElementById('stop').disabled = false
      try {
        const { sessionId } = await rpc('session.create', { cwd: 'F:\\gaotushixi' })
        currentSession = sessionId
        line('system', `会话已创建: ${sessionId}`)
        openMux(sessionId)
        await rpc('session.prompt', { sessionId, mode: 'queue', content: [{ type: 'text', text }] })
        line('', `👤 ${text}`)
      } catch (err) {
        line('system', `错误: ${err.message}`)
        stopStreaming()
      }
    }

    document.getElementById('stop').onclick = async () => {
      if (currentSession) {
        try { await rpc('session.cancel', { sessionId: currentSession }) } catch { /* 已结束 */ }
      }
      line('system', '已请求停止')
      stopStreaming()
    }

    document.getElementById('list').onclick = async () => {
      try {
        const { items } = await rpc('session.list', {})
        document.getElementById('sessions').textContent = items
          .sort((a, b) => b.updatedAt - a.updatedAt)
          .slice(0, 10)
          .map(s => `${s.running ? '●' : '○'} ${s.sessionId}  ${new Date(s.updatedAt).toISOString()}`)
          .join('\n')
      } catch (err) {
        document.getElementById('sessions').textContent = `错误: ${err.message}`
      }
    }

    document.getElementById('prompt').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('run').click()
    })
  </script>
</body>
</html>
